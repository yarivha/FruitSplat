<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fruit Splat</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #14161a;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* The canvas is left at its authored 1200x740 and is NOT scaled by CSS.
     That is deliberate, and the two lines below from macroquad's JS bundle are
     the reason:

         resize():                 canvas.clientWidth  * dpi_scale()
         mouse_relative_position(): (clientX - canvas.getBoundingClientRect().left) * dpi_scale()

     The drawing buffer is sized from clientWidth, which ignores CSS transforms.
     Mouse input is mapped through getBoundingClientRect(), which does not. Scale
     the canvas with `transform` and those two disagree by exactly the scale
     factor: the game still renders at 1200x740, but every click arrives
     compressed toward the top-left. At any scale below 0.88 the shop bar drops
     out of reach altogether and no tower can be armed at all.

     Sizing with CSS width/height instead keeps them in agreement, but then the
     drawing buffer follows the window and screen_width() stops being 1200 —
     which the HUD, the shop bar and the route-card row are all laid out against.

     So: no scaling. Browser zoom is the way to fit a smaller screen, and it
     works correctly because it scales layout and hit-testing together. */
  #glcanvas {
    display: block;
    flex: 0 0 auto;
    width: 1200px;
    height: 740px;
    outline: none;
  }
</style>
</head>
<body>
  <canvas id="glcanvas" width="1200" height="740" tabindex="1"></canvas>
  <script>
    // Right click is a game input — it cancels a placement and closes the tower
    // panel. Without this the browser opens its own context menu over the
    // canvas instead, and the game never sees the click at all.
    document.getElementById("glcanvas")
      .addEventListener("contextmenu", e => e.preventDefault());
  </script>
  <script src="mq_js_bundle.js"></script>
  <script>
    // macroquad finds the canvas by this id and drives it from the wasm module.
    load("fruit-splat.wasm");
  </script>
</body>
</html>
